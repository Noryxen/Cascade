name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Sync dev dependencies
        run: uv sync --only-group dev --no-install-project

      - name: Ruff (lint)
        run: make lint

      - name: isort (check only)
        run: uv run isort --check-only --profile black .

      - name: black (check only)
        run: uv run black --check .
